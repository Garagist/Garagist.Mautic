'Garagist.Mautic:Mixin.Form':
  abstract: true
  label: "${Neos.Node.labelForNode(node).postfix(' (' + Array.first(String.split(q(node).property('mauticForm'), '---')) + ')')}"
  ui:
    label: i18n
    icon: envelope-open-text
    position: 2000
    inspector:
      groups:
        mautic:
          label: Mautic
          icon: envelope-open-text
  properties:
    mauticForm:
      type: string
      search:
        indexing: false
      ui:
        label: i18n
        reloadPageIfChanged: true
        inspector:
          group: mautic
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
          editorOptions:
            allowEmpty: true
            dataSourceIdentifier: garagist-mautic-forms
