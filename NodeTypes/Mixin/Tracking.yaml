# Add this to your homepage

'Garagist.Mautic:Mixin.Tracking':
  abstract: true
  superTypes:
    'Garagist.Mautic:Mixin.Group': true
  properties:
    mauticTrackingUrl:
      defaultValue: ''
      type: string
      search:
        indexing: false
      ui:
        label: i18n
        inspector:
          group: mautic
          editor: 'Beromir.ToggleEditor/Editor'
          editorOptions:
            layout: 'list'
            allowEmpty: false
            dataSourceIdentifier: garagist-mautic-tracking
            dataSourceDisableCaching: false
