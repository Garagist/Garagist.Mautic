'Carbon.Newsletter:Mixin.Container':
  superTypes:
    'Carbon.Newsletter:Mixin.TestEmailRecipients': true
  ui:
    inspector:
      groups:
        email:
          icon: paper-plane
          label: 'Garagist.Mautic:NodeTypes.Override.Container:groups.email'
          position: 20
  options:
    template:
      childNodes:
        main:
          name: 'main'
          childNodes:
            form:
              type: 'Garagist.Mautic:Mixin.Form'
        system:
          childNodes:
            confirmed:
              childNodes:
                mail-subscribe:
                  properties:
                    globalSenderName: '${data.globalSenderName}'
                    globalSenderMail: '${data.globalSenderMail}'
                mail-subscribe-repeat:
                  properties:
                    globalSenderName: '${data.globalSenderName}'
                    globalSenderMail: '${data.globalSenderMail}'
            settings:
              childNodes:
                mail-settings:
                  properties:
                    globalSenderName: '${data.globalSenderName}'
                    globalSenderMail: '${data.globalSenderMail}'
                main:
                  name: 'main'
                  childNodes:
                    form:
                      type: 'Garagist.Mautic:Mixin.Form'
            deleted:
              childNodes:
                mail-delete:
                  properties:
                    globalSenderName: '${data.globalSenderName}'
                    globalSenderMail: '${data.globalSenderMail}'
  properties:
    senderEmails:
      type: repeatable
      search:
        indexing: false
      ui:
        label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.senderEmails'
        inspector:
          group: email
          position: 10
          editorOptions:
            buttonAddLabel: 'Garagist.Mautic:NodeTypes.Override.Container:properties.senderEmails.add'
            properties:
              email:
                type: 'string'
                validation:
                  Neos.Neos/Validation/NotEmptyValidator: {}
                  Neos.Neos/Validation/EmailAddressValidator: {}
    globalSenderName:
      type: string
      search:
        indexing: false
      ui:
        label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.globalSenderName'
        inspector:
          group: email
          position: 20
    globalSenderMail:
      type: string
      search:
        indexing: false
      ui:
        label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.globalSenderMail'
        inspector:
          group: email
          position: 30
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            allowEmpty: true
            values: 'ClientEval: node.properties.senderEmails.map(({email}) => ({ label: email, value: email}))'
    testEmailRecipients:
      ui:
        inspector:
          group: email
          position: 100
    mauticSettings:
      type: repeatable
      search:
        indexing: false
      ui:
        label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.mauticSettings'
        inspector:
          group: email
          position: 500
          editorOptions:
            max: 1
            buttonAddLabel: 'Garagist.Mautic:NodeTypes.Override.Container:properties.mauticSettings.add'
            properties:
              url:
                type: string
                label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.mauticSettings.url'
                editor: 'Carbon.Editor.Styling/TextInput'
                editorOptions:
                  type: 'url'
                validation:
                  Neos.Neos/Validation/NotEmptyValidator: {}
              username:
                type: string
                label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.mauticSettings.username'
                editor: 'Carbon.Editor.Styling/TextInput'
                validation:
                  Neos.Neos/Validation/NotEmptyValidator: {}
              password:
                type: string
                label: 'Garagist.Mautic:NodeTypes.Override.Container:properties.mauticSettings.password'
                editor: 'Carbon.Editor.Styling/TextInput'
                editorOptions:
                  type: 'password'
                  autoComplete: 'off'
                validation:
                  Neos.Neos/Validation/NotEmptyValidator: {}
