'Carbon.Newsletter:Mixin.Email':
  options:
    template:
      properties:
        globalSenderName: '${Carbon.Newsletter.globalProperty(node, "globalSenderName")}'
  properties:
    id:
      ui:
        inspector:
          editorOptions:
            system: Mautic
            dataSource: garagist-mautic-email
    globalSenderName:
      type: string
    senderName:
      type: string
      ui:
        label: 'Garagist.Mautic:NodeTypes.Override.Email:properties.senderName'
        inspector:
          group: document
          position: 210
          editorOptions:
            placeholder: 'ClientEval: node.properties.globalSenderName'
